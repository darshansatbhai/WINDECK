name: windeck
description: WinDeck Flutter Android App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  provider: ^6.1.1
  uuid: ^4.3.3
  flutter_colorpicker: ^1.1.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  http: ^1.1.0
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
