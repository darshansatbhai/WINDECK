<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WinDeck Server</title>
  <style>
    body {
      background-color: #121212;
      color: #FFFFFF;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
      background: linear-gradient(90deg, #00C6FF 0%, #0072FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card {
      background-color: #1E1E1E;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
    .otp-display {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 8px;
      margin: 20px 0;
      color: #00C6FF;
    }
    button {
      background-color: #333333;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover { background-color: #444444; }
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #888888;
    }
    .device-list {
      text-align: left;
      margin-top: 20px;
      background: #252525;
      border-radius: 8px;
      padding: 15px;
    }
    .device-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #333;
    }
    .device-item:last-child { border-bottom: none; }
    .btn-danger { background-color: #FF4136; }
    .btn-danger:hover { background-color: #E03A30; }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="header">
      <h1>WinDeck Server</h1>
      <span class="status-indicator">● Running</span>
    </div>

    <div class="otp-card">
      <h2>Server Status</h2>
      <p style="color: #bbb; margin-top: 10px;">Connect your phone over the same WiFi.</p>
    </div>

    <div class="devices-section">
      <h3>Connected Devices</h3>
      <div class="device-list" id="device-list">
        <p style="color: #555;">Waiting for phone to connect...</p>
      </div>
    </div>
  </div>

  <script>
    // Use Socket.io client to listen for devices connecting
    const script = document.createElement('script');
    script.src = '/socket.io/socket.io.js';
    script.onload = () => {
      const socket = io();
      socket.on('device-connected', (id) => {
        document.getElementById('device-list').innerHTML = `
          <div class="device-item">
            <span>Phone Connected</span>
          </div>
        `;
      });
    };
    document.head.appendChild(script);
  </script>
</body>
</html>
